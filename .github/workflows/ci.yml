name: CI

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Run Tests with Race Detector
        run: go test -v -race -shuffle=on ./...

      - name: Run Double-Count Shuffle Tests
        run: go test -shuffle=on -count=2 ./...

      - name: Build Binary
        run: go build -v ./...
